# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Coverage is computed with covr and written to the job summary (no external service).
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          print(cov)
          total <- covr::percent_coverage(cov)
          by_file <- covr::tally_coverage(cov, by = "line")
          files <- aggregate(value ~ filename, data = by_file,
                             FUN = function(v) 100 * mean(v > 0))
          lines <- c(
            sprintf("## Test coverage: %.1f%%", total),
            "",
            "| File | Coverage |",
            "|---|---:|",
            sprintf("| `%s` | %.1f%% |", files$filename, files$value)
          )
          summary_file <- Sys.getenv("GITHUB_STEP_SUMMARY")
          if (nzchar(summary_file)) {
            cat(lines, sep = "\n", file = summary_file, append = TRUE)
          }
        shell: Rscript {0}
